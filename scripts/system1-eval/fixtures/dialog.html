<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driftwood Outfitters</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; color: #222; }
  header { display: flex; gap: 16px; padding: 10px 20px; border-bottom: 1px solid #ddd; }
  main { padding: 12px 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; }
  .card h2 { font-size: 14px; margin: 0 0 4px; }
  .news { margin-top: 14px; display: flex; gap: 8px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  #overlay[hidden] { display: none; }
  .dialog { background: #fff; padding: 18px 20px; border-radius: 8px; max-width: 420px; }
  .dialog .actions { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <a href="#home">Home</a>
  <a href="#stores">Stores</a>
  <a href="#cart" aria-label="Cart">Cart (<span id="cart-count">0</span>)</a>
</header>
<main>
  <div class="grid" id="grid"></div>
  <form class="news" onsubmit="return subscribe(event)">
    <input type="email" name="email" placeholder="Your email for the newsletter">
    <button type="submit">Subscribe</button>
  </form>
</main>
<div id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cookie-title">
    <h2 id="cookie-title">We use cookies</h2>
    <p>We use cookies to run this site and, with your consent, to measure how it is used.</p>
    <div class="actions">
      <button id="accept">Accept all</button>
      <button id="reject">Reject non-essential</button>
      <button id="manage">Manage preferences</button>
    </div>
  </div>
</div>
<script>
  const products = ['Nimbus tote', 'Aurora mug', 'Harbor throw', 'Cedar candle', 'Fjord bowl', 'Orbit clock']
  const colours = ['green', 'grey']
  window.__cart = []
  window.__consent = null
  window.__subscribed = null
  const grid = document.getElementById('grid')
  for (const name of products) {
    const card = document.createElement('div')
    card.className = 'card'
    card.innerHTML = `<h2>${name}</h2>`
    for (const c of colours) {
      const b = document.createElement('button')
      b.textContent = `Add ${c}`
      b.setAttribute('aria-label', `Add ${name} (${c}) to cart`)
      b.addEventListener('click', () => {
        window.__cart.push(`${name} (${c})`)
        document.getElementById('cart-count').textContent = String(window.__cart.length)
      })
      card.appendChild(b)
    }
    grid.appendChild(card)
  }
  const close = (v) => { window.__consent = v; document.getElementById('overlay').hidden = true }
  document.getElementById('accept').onclick = () => close('all')
  document.getElementById('reject').onclick = () => close('essential')
  document.getElementById('manage').onclick = () => close('custom')
  function subscribe(e) { e.preventDefault(); window.__subscribed = new FormData(e.target).get('email'); return false }
</script>
</body>
</html>
